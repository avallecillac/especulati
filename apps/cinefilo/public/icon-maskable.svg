    <g fill="none" stroke="#7A6A55" stroke-width="2.4"><rect x="31" y="104" width="22" height="20" rx="5"/><rect x="127" y="104" width="22" height="20" rx="5"/></g>
    <g fill="#D4A253"><rect x="63" y="104" width="22" height="20" rx="5"/><rect x="95" y="104" width="22" height="20" rx="5"/></g>
    <g fill="#D4A253" opacity="0.55"><rect x="65" y="98" width="18" height="4" rx="2"/><rect x="97" y="98" width="18" height="4" rx="2"/></g>
  </g>
</svg>
