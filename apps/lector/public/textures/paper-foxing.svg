<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700">
  <!-- Foxing: sparse rust freckles of old paper. Original, generated noise. -->
  <filter id="x" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.50  0 0 0 0 0.28  0 0 0 0 0.10  3.2 0 0 0 -2.3"/>
    <feGaussianBlur stdDeviation="0.6"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#x)" opacity="0.32"/>
</svg>
